name: Package and helper checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: cut-station
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew list ffmpeg || brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
          $binary = Get-ChildItem -Path (Join-Path $env:ChocolateyInstall 'lib/ffmpeg') -Filter ffmpeg.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($binary) {
            $mediaBin = $binary.Directory.FullName
          } else {
            $command = Get-Command ffmpeg -ErrorAction SilentlyContinue
            if (-not $command) { throw "Installed FFmpeg executable was not found" }
            $mediaBin = Split-Path -Parent $command.Source
          }
          if (-not (Test-Path (Join-Path $mediaBin 'ffprobe.exe'))) { throw "FFprobe executable was not found" }
          $mediaBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify media tools are available for tests
        run: python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe'), 'FFmpeg/ffprobe must be on PATH; media tests must not be silently skipped in CI'"
      - name: Package checks
        working-directory: cut-station
        run: python scripts/release_check.py
      - name: Local helper tests (synthetic; no real agent/app run)
        working-directory: cut-station
        run: python -m unittest discover -s tests -v
